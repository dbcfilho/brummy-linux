# Limpa o que é só do live e aplica o Brummy no usuário novo.
# Roda depois de users (o usuário já existe) e antes de packages e
# initcpiocfg (tira o archiso.conf que sobrescreveria os HOOKS e põe o kernel
# no /boot antes de qualquer mkinitcpio). Detalhes no próprio script.
---
dontChroot: false
timeout: 900
script:
  - command: "/usr/local/bin/brummy-pos-instalacao sistema @@USER@@"
    timeout: 900
