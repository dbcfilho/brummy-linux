# Brummy Linux — Calamares (instalação OFFLINE por unpackfs).
#
# A ISO live JÁ É o Brummy: o unpackfs copia o squashfs do live para o disco.
# Ou seja, o que a pessoa vê no live é exatamente o que ela instala — sem
# depender de internet e sem rodar o install.sh na máquina dela.
---
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: brummy
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
