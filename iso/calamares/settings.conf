# Brummy Linux — Calamares (instalação OFFLINE por unpackfs).
#
# A ISO live JÁ É o Brummy: o unpackfs copia o squashfs do live para o disco.
# Ou seja, o que a pessoa vê no live é exatamente o que ela instala — sem
# depender de internet e sem rodar o install.sh na máquina dela.
---
modules-search: [ local, /usr/lib/calamares/modules ]

# Duas etapas do bin brummy-pos-instalacao (ver shellprocess-brummy*.conf).
instances:
  - id: brummy
    module: shellprocess
    config: shellprocess-brummy.conf
  - id: brummy-grub
    module: shellprocess
    config: shellprocess-brummy-grub.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      # antes do packages: remover o mkinitcpio-archiso dispara o hook do
      # pacman que roda mkinitcpio -P, e ele precisa do archiso.conf já fora
      # e do vmlinuz já no /boot
      - shellprocess@brummy
      - packages
      - initcpiocfg
      - initcpio
      - grubcfg
      - shellprocess@brummy-grub
      - bootloader
      - umount
  - show:
      - finished

branding: brummy
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
