# Build da ISO live no GitHub, sem precisar de Docker na sua máquina.
# Manual: aba Actions → iso → Run workflow. A ISO sai como artefato do run
# (fica 3 dias). Roda o mesmo ./iso/build.sh de sempre, no runner.
name: iso

on:
  workflow_dispatch:
    inputs:
      com_dev:
        description: "incluir o bundle dev (Java/Node/Postgres/k8s) — ISO bem maior"
        type: boolean
        default: false
      publica:
        description: "ISO para publicar: sem pacotes que não podem ser redistribuídos"
        type: boolean
        default: false
      sem_cache:
        description: "reconstruir todos os pacotes do AUR"
        type: boolean
        default: false

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      # O runner vem com ~14GB livres; work dir do mkarchiso + squashfs + ISO
      # passam disso. Estes diretórios são ferramentas que a build não usa.
      - name: libera espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      # Os pacotes do AUR são a parte lenta (e a que mais quebra): cache entre
      # runs. restore e save separados porque o actions/cache normal só salva
      # quando o job passa — e é justo a build que quebra no mkarchiso, depois
      # de 15 minutos de AUR, que mais precisa do cache na próxima.
      - name: restaura o cache do AUR
        uses: actions/cache/restore@v4
        with:
          path: iso/.cache/aur
          key: aur-${{ github.run_id }}
          restore-keys: aur-

      - name: build
        env:
          BRUMMY_ISO_SEM_DEV: ${{ inputs.com_dev && '0' || '1' }}
          BRUMMY_ISO_PUBLICA: ${{ inputs.publica && '1' || '0' }}
        run: ./iso/build.sh ${{ inputs.sem_cache && '--no-cache' || '' }}

      - name: salva o cache do AUR (mesmo se a build falhou)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: iso/.cache/aur
          key: aur-${{ github.run_id }}

      - name: pacotes que ficaram de fora
        if: always()
        run: |
          echo "AUR que não construiu:"; cat iso/.cache/aur/FALHARAM.txt 2>/dev/null || echo "  nenhum"
          echo "sem repositório nenhum:"; cat iso/out/SUMIDOS.txt 2>/dev/null || echo "  nenhum"
          echo "fora por licença:"; cat iso/.cache/aur/NAO_REDISTRIBUI.txt 2>/dev/null || echo "  nenhum"
          echo; cat iso/out/LICENCAS.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: brummy-iso
          path: |
            iso/out/*.iso
            iso/out/LICENCAS.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
