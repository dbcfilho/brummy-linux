# CI do Brummy: o mesmo tools/check.sh que roda na sua máquina, mais o
# hyprland --verify-config num container Arch — a checagem que antes só
# acontecia dentro da VM.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check.sh (shellcheck, JSON, Lua, subcomandos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependências
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - name: tools/check.sh
        run: ./tools/check.sh

  verify-config:
    name: hyprland --verify-config (${{ matrix.profile }})
    runs-on: ubuntu-latest
    container: archlinux:latest
    # Experimental até provar que o verify-config roda sem sessão gráfica no
    # runner. Falha aparece no resumo, mas não pinta o commit de vermelho.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: desktop,  mon: monitors-desktop.lua,  gpu: gpu-amd.lua }
          - { profile: thinkpad, mon: monitors-thinkpad.lua, gpu: gpu-intel.lua }
          - { profile: general,  mon: monitors-general.lua,  gpu: gpu-intel.lua }
    steps:
      - uses: actions/checkout@v4
      - name: instala o Hyprland
        run: pacman -Syu --noconfirm --needed hyprland
      - name: monta ~/.config/hypr como o install.sh faz
        run: |
          mkdir -p "$HOME/.config"
          cp -r config/hypr "$HOME/.config/hypr"
          ln -sf "$HOME/.config/hypr/modules/${{ matrix.mon }}" "$HOME/.config/hypr/modules/profile-monitors.lua"
          ln -sf "$HOME/.config/hypr/modules/${{ matrix.gpu }}" "$HOME/.config/hypr/modules/profile-gpu.lua"
      - name: verify-config
        shell: bash
        run: |
          set -o pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          Hyprland --version | head -1
          Hyprland --verify-config 2>&1 | tee verify.log
          # na VM, config válida termina com "config ok"
          grep -qi 'config ok' verify.log
