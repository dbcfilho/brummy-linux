# Brummy Linux v0.2-mac — Hyprland híbrido estilo macOS
# Teclado-driven (tiling) + mouse tradicional (arrastar, dock, topbar)
$mainMod = SUPER

# Autostart macOS-like: topbar, dock, wallpaper, polkit
exec-once = waybar
exec-once = hyprpaper
exec-once = nwg-dock-hyprland -d -mb 12 -i 48 -w 6 -hotspot_delay 150 -cursor_insert
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --watch cliphist store

# Perfil de máquina (monitores + GPU): linkado pelo install.sh --profile
# profile-monitors.conf -> monitors-desktop | monitors-thinkpad | monitors-general
# profile-gpu.conf -> gpu-amd | gpu-intel
source = ~/.config/hypr/conf.d/profile-monitors.conf
source = ~/.config/hypr/conf.d/profile-gpu.conf
source = ~/.config/hypr/conf.d/trackpoint.conf
general {
  gaps_in = 8
  gaps_out = 14
  border_size = 1
  col.active_border = rgba(ffffff55)
  col.inactive_border = rgba(00000033)
  layout = dwindle
  # Híbrido mouse: redimensionar pela borda sem precisar de tecla, snap nas bordas
  resize_on_border = true
  hover_icon_on_border = true
  snap { enabled = true window_gap = 10 }
}
# Estética macOS: cantos bem arredondados, sombra suave, blur frosted glass
decoration {
  rounding = 16
  active_opacity = 1.0
  inactive_opacity = 0.97
  drop_shadow = true
  shadow_range = 30
  shadow_render_power = 3
  col.shadow = rgba(00000055)
  dim_inactive = true
  dim_strength = 0.08
  blur {
    enabled = true
    size = 12
    passes = 3
    new_optimizations = true
    ignore_opacity = true
    xray = false
  }
}
# Frosted glass na bar, dock, spotlight
layerrule = blur, waybar
layerrule = blur, nwg-dock-hyprland
layerrule = blur, wofi
layerrule = ignorealpha 0.3, waybar
animations {
  enabled = yes
  bezier = mac, 0.05, 0.9, 0.1, 1.05
  animation = windows, 1, 5, mac, slide
  animation = fade, 1, 5, default
  animation = workspaces, 1, 4, mac, slide
}

input {
  kb_layout = br,us
  kb_variant = ,intl
  follow_mouse = 1
  # Mouse tradicional: foco segue mouse, aceleração adaptativa, clique natural
  float_switch_override_focus = 1
  mouse_refocus = true
  accel_profile = adaptive
  scroll_method = 2fg
  touchpad { natural_scroll = yes clickfinger_behavior = true tap-to-click = true drag_lock = false }
}

# Cursor maior e visível (tradicional)
env = XCURSOR_SIZE,28
env = HYPRCURSOR_SIZE,28
misc {
  focus_on_activate = true
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
  animate_mouse_windowdragging = true
  # Arrastar janela flutuante com mouse move ela pra frente automaticamente
  initial_workspace_tracking = 1
}
gestures { workspace_swipe = true workspace_swipe_fingers = 3 }

# Híbrido: janelas tradicionais flutuam, resto tila
windowrulev2 = float, class:^(thunar|nautilus|org.gnome.Nautilus|pavucontrol|nm-connection-editor|file-roller|wlogout|nwg-look|gparted|GParted)$
windowrulev2 = center, class:^(thunar|nautilus|org.gnome.Nautilus|pavucontrol|wlogout)$
windowrulev2 = size 900 600, class:^(thunar|nautilus|org.gnome.Nautilus)$
windowrulev2 = stayfocused, title:^(Picture-in-Picture)$
# Gaming: Steam/jogos fullscreen sem sombra/dim, tearing permitido p/ VRR
windowrulev2 = fullscreen, class:^(steam_app.*|gamescope)$
windowrulev2 = noblur, class:^(steam_app.*)$
windowrulev2 = noshadow, class:^(steam_app.*)$
windowrulev2 = immediate, class:^(steam_app.*)$

# Atalhos descobríveis (ver `brummy apps`)
bind = $mainMod, Q, exec, kitty
bind = $mainMod, E, exec, nautilus || thunar
bind = $mainMod, B, exec, helium-browser || helium || firefox
bind = $mainMod SHIFT, C, exec, codium || code
bind = $mainMod, D, exec, wofi --show drun --allow-images
bind = $mainMod, SPACE, exec, wofi --show drun --allow-images # Spotlight estilo macOS (Cmd+Space)
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, J, cyclenext,
bind = $mainMod, K, cyclenext, prev
bind = $mainMod SHIFT, Q, exit,

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Mouse tradicional
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Sem mod também: ALT+arrastar (estilo tradicional) + scroll no desktop troca workspace
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
# Clique do meio fecha (rápido no mouse), botão direito flutua
bind = $mainMod, mouse:274, killactive,
bind = $mainMod SHIFT, mouse:273, togglefloating,

# Mídia / brilho (notebook tradicional)
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
