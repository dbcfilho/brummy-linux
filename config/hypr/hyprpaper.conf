# Brummy hyprpaper — só o daemon; quem aplica a imagem é `brummy-wallpaper-apply`.
#
# Por que assim: o wallpaper padrão mora em ~/Pictures/Brummy/current, que é um
# LINK sem extensão. O hyprpaper escolhe o decodificador pela extensão do arquivo,
# então "current" não carregava e a sessão caía no fundo padrão do Hyprland.
# O script resolve o link (readlink -f) e manda o caminho real por IPC.
ipc = on
splash = false

# O link tem extensão de propósito: o hyprpaper escolhe o decodificador pela
# extensão do arquivo, e um link chamado só "current" não carregava — foi o que
# deixou a sessão com o fundo padrão do Hyprland. Com ".jpg" ele resolve sozinho,
# sem depender de nenhum script ter sido instalado em ~/.local/bin.
preload = ~/Pictures/Brummy/current.jpg
wallpaper = , ~/Pictures/Brummy/current.jpg
