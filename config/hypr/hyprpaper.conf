# Brummy hyprpaper — wallpaper do Brummy no login.
#
# hyprpaper >= 0.8 foi reescrito (hyprtoolkit) e mudou a config: as diretivas
# antigas `preload =` e `wallpaper = monitor,path` não existem mais — agora é
# um bloco `wallpaper {}`. O IPC também mudou (o script brummy-wallpaper-apply
# manda `hyprctl hyprpaper wallpaper <monitor>,<path>`).
#
# O caminho aponta para o link ~/Pictures/Brummy/current.jpg: o hyprpaper decide
# o decodificador pela extensão, então o link tem ".jpg" no nome. O script
# resolve o link (readlink -f) e reaponta para a imagem real escolhida.
ipc = on
splash = false

wallpaper {
    monitor =
    fit_mode = cover
    path = ~/Pictures/Brummy/current.jpg
}
