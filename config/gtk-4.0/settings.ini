# Brummy — GTK4. Apps libadwaita (Nautilus, Calculadora, Text Editor) IGNORAM
# gtk-theme-name; quem manda neles é o color-scheme do gsettings, que o
# install.sh seta para 'prefer-dark'. Isto aqui cobre os GTK4 não-adwaita.
[Settings]
gtk-theme-name=WhiteSur-Dark
gtk-icon-theme-name=WhiteSur
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=28
gtk-font-name=Inter 11
gtk-application-prefer-dark-theme=1
